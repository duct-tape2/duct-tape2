name: $99 GitHub Repo Product Page Inquiry
description: Check fit for one existing public repo before private payment instructions.
title: "[PAID INQUIRY] "
labels: ["paid-inquiry"]
body:
  - type: markdown
    attributes:
      value: |
        Use this public-safe form for the fixed $99 GitHub Repo Product Page Service:
        https://duct-tape2.github.io/repo-launch/

        Inspect the public evidence first:
        - Work: https://duct-tape2.github.io/work/
        - Case study: https://duct-tape2.github.io/examples/storefront-starter-case-study/

        One existing public repo becomes a buyer-ready product page with clear positioning, public proof, README polish, an approved inquiry path, and delivery notes. Delivery is four days after the repo, scope, assets, and payment are confirmed.

        Submit the public repo and desired outcome first. The maintainer confirms fit and scope, then provides private payment instructions directly. No public checkout is represented as ready, and work begins only after payment is confirmed.

        Do not post full transaction IDs, payment screenshots, private files, customer data, passwords, API keys, private analytics, or private URLs in this public issue.
  - type: textarea
    id: public-repo
    attributes:
      label: Existing public repo or product URL
      description: Share only a public URL. Do not include credentials or private access details.
      placeholder: "https://github.com/owner/repository"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Buyer and outcome
      description: Briefly describe the intended buyer and what should be clearer after this setup.
      placeholder: "The buyer is... The page should help them understand..."
    validations:
      required: true
