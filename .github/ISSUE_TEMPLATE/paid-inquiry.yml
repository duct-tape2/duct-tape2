name: $99 GitHub Repo Product Page Inquiry
description: Check fit for one existing repo and confirm a working checkout before payment.
title: "[PAID INQUIRY] "
labels: ["paid-inquiry"]
body:
  - type: markdown
    attributes:
      value: |
        Use this public-safe form for the fixed $99 GitHub Repo Product Page Service:
        https://duct-tape2.github.io/repo-launch/

        One existing public repo or small digital product becomes a buyer-ready page with clear positioning, public proof, README polish, a tested inquiry path, and delivery notes. Delivery is four days after the repo, scope, assets, and payment are confirmed.

        Checkout availability is temporarily paused while payout settings are restored. Do not attempt payment through an unconfirmed link. Select "Need a confirmed working checkout" below; the maintainer will verify the payment route before any work begins.

        Do not post full transaction IDs, payment screenshots, private files, customer data, passwords, API keys, private analytics, or private URLs in this public issue.
  - type: dropdown
    id: payment-status
    attributes:
      label: Payment status
      options:
        - Asking about fit before payment
        - Need a confirmed working checkout
        - Already paid through a previously confirmed checkout
    validations:
      required: true
  - type: textarea
    id: public-repo
    attributes:
      label: Existing public repo or product URL
      description: Share only a public URL. Do not include credentials or private access details.
      placeholder: "https://github.com/owner/repository"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Buyer and outcome
      description: Briefly describe the intended buyer and what should be clearer after this setup.
      placeholder: "The buyer is... The page should help them understand..."
    validations:
      required: true
